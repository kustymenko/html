<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HTML: мозковий штурм</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: одна сцена для проєктора — смуга етапів угорі, код і «вікно браузера» посередині, табло 4 команд унизу. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --ink: #0f1e3a;
  --muted: #55627c;
  --line: #d3dbe8;
  --accent: #d9480f;
  --accent-ink: #ffffff;
  --flash: #f3c31f;
  --flash-ink: #2a2000;
  --good: #17784a;
  --good-soft: #dcf2e6;
  --bad: #c0392b;
  --bad-soft: #fbe3df;
  --code-bg: #0e1a33;
  --code-ink: #e7edfb;
  --code-tag: #ff9f7a;
  --code-attr: #ffd43b;
  --code-val: #8fe3a7;
  --code-com: #8392b3;
  /* «Вікно браузера» навмисно світле в обох темах: так виглядає сторінка учня */
  --page-bg: #ffffff;
  --page-ink: #111111;
  --page-line: #999999;
  --page-th: #eeeeee;
  --chrome: #e4e8ef;
  --chrome-ink: #5b6475;
  --t1: #2458a6;
  --t2: #c47a00;
  --t3: #17784a;
  --t4: #b8326b;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-page: "Times New Roman", Times, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1325; --surface: #121f3a; --ink: #eef2fb; --muted: #9eabc6; --line: #26365c;
    --accent: #ff8a5c; --accent-ink: #1a0800; --flash: #ffd43b; --flash-ink: #2a2000;
    --good: #4fcf8d; --good-soft: #12321f; --bad: #ff7d6e; --bad-soft: #3a1714;
    --code-bg: #060d1c; --code-ink: #e7edfb; --code-com: #7d8cad;
    --chrome: #2a3654; --chrome-ink: #b8c3dc;
    --t1: #6fa1ff; --t2: #ffc04d; --t3: #4fcf8d; --t4: #ff7fb0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1325; --surface: #121f3a; --ink: #eef2fb; --muted: #9eabc6; --line: #26365c;
  --accent: #ff8a5c; --accent-ink: #1a0800; --flash: #ffd43b; --flash-ink: #2a2000;
  --good: #4fcf8d; --good-soft: #12321f; --bad: #ff7d6e; --bad-soft: #3a1714;
  --code-bg: #060d1c; --code-ink: #e7edfb; --code-com: #7d8cad;
  --chrome: #2a3654; --chrome-ink: #b8c3dc;
  --t1: #6fa1ff; --t2: #ffc04d; --t3: #4fcf8d; --t4: #ff7fb0;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 12px;
  overflow-x: hidden;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--flash); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.track { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; min-width: 0; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip.done { color: var(--ink); }
.chip.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.tool[aria-pressed="false"] { color: var(--muted); }

.stage {
  flex: 1 1 auto; min-height: 0; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: clamp(16px, 2.4vw, 40px);
  display: flex; flex-direction: column; gap: clamp(10px, 1.2vw, 20px);
}
.eyebrow { font-size: clamp(13px, 1vw, 17px); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.q-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.5vw, 44px); line-height: 1.15; text-wrap: balance; margin: 4px 0 0; }
.q-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 2vw, 36px); align-items: start; }
.q-body.wide { grid-template-columns: minmax(0, 1fr); }
.q-body.split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.q-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

.code {
  margin: 0; background: var(--code-bg); color: var(--code-ink);
  font-family: var(--font-code); font-size: clamp(16px, 2vw, 36px); line-height: 1.4;
  border-radius: 14px; padding: clamp(14px, 1.6vw, 28px) clamp(16px, 2vw, 34px);
  overflow-x: auto; tab-size: 2;
}
.code.small { font-size: clamp(13px, 1.35vw, 25px); }
.code .ln { display: block; padding-inline: 8px; margin-inline: -8px; border-radius: 6px; white-space: pre; }
.code .ln.bad { background: color-mix(in srgb, var(--bad) 38%, transparent); }
.code .ln.good { background: color-mix(in srgb, var(--good) 38%, transparent); }
.tg { color: var(--code-tag); }
.at { color: var(--code-attr); }
.vl { color: var(--code-val); }
.cm { color: var(--code-com); font-style: italic; }

.ask {
  border-left: 6px solid var(--flash); background: color-mix(in srgb, var(--flash) 14%, var(--surface));
  border-radius: 0 12px 12px 0; padding: 12px 18px; font-size: clamp(18px, 1.8vw, 32px); font-weight: 800; text-wrap: balance;
}
.ask.compact { font-size: clamp(15px, 1.2vw, 22px); padding: 6px 14px; }
.ask small { display: block; font-size: 0.55em; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.teacher { margin-top: auto; display: grid; gap: 6px; font-size: 14px; color: var(--muted); max-width: 46ch; }
.teacher b { color: var(--ink); }

/* Вікно браузера */
.browser { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--page-bg); min-width: 0; }
.browser .chrome { display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: var(--chrome); color: var(--chrome-ink); font-size: 13px; font-weight: 700; }
.browser .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--chrome-ink); opacity: .35; }
.browser .chrome span { margin-left: 6px; font-family: var(--font-code); font-weight: 400; }
.page { background: var(--page-bg); color: var(--page-ink); font-family: var(--font-page); font-size: clamp(16px, 1.5vw, 27px); line-height: 1.3; padding: 8px 18px 14px; overflow-x: auto; }
.page.small { font-size: clamp(14px, 1.15vw, 21px); }
.page h1, .page h2, .page h3, .page h4, .page h5, .page h6 { margin: 0.35em 0; }
.page p { margin: 0.4em 0; }
.page ul, .page ol { margin: 0.3em 0; padding-left: 1.6em; }
.page table { border-collapse: collapse; margin: 0.3em 0; }
.page th, .page td { border: 1px solid var(--page-line); padding: 4px 10px; }
.page th { background: var(--page-th); }
.page caption { padding-bottom: 4px; }
.page img { vertical-align: top; }
.page img:not([width]) { max-width: 100%; max-height: 7em; width: auto; height: auto; }

/* Таймер */
.timer { display: grid; justify-items: center; gap: 10px; }
.ring { width: clamp(120px, 12vw, 220px); aspect-ratio: 1; max-width: 100%; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .track-c { stroke: var(--line); }
.ring .fill-c { stroke: var(--flash); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.2s; }
.ring.low .fill-c { stroke: var(--bad); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 4vw, 72px); font-variant-numeric: tabular-nums; }
.ring.over .num { font-size: clamp(24px, 2.6vw, 46px); color: var(--bad); }
.ring.low:not(.over) .num { color: var(--bad); }
@media (prefers-reduced-motion: no-preference) {
  .ring.low:not(.over):not(.paused) { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
}

/* Відповідь */
.answer { display: grid; gap: 12px; }
.answer[hidden] { display: none !important; }
.reveal { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.reveal > div { min-width: 0; display: grid; gap: 10px; align-content: start; }
.ans { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.4vw, 44px); line-height: 1.2; background: var(--good-soft); border: 2px solid var(--good); border-radius: 14px; padding: 12px 20px; text-wrap: balance; }
.out-label { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.out-label.bad { color: var(--bad); }
.out-label.good { color: var(--good); }
.explain { font-size: clamp(16px, 1.4vw, 26px); max-width: 60ch; margin: 0; text-wrap: pretty; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.compare > div { min-width: 0; display: grid; gap: 8px; align-content: start; }
.rows { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.rows .col { min-width: 0; display: grid; gap: 8px; align-content: start; }
.rows .code.small { font-size: clamp(12px, 1.15vw, 21px); padding: 12px 18px; }
.rows .page.small { font-size: clamp(13px, 1.05vw, 19px); }
.miss { margin: 0; font-weight: 700; color: var(--bad); font-size: clamp(15px, 1.2vw, 22px); }
.note { border: 2px solid var(--accent); border-radius: 14px; padding: 12px 18px; font-size: clamp(17px, 1.6vw, 28px); font-weight: 700; margin: 0; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; font-weight: 800; font-size: 16px; min-height: 48px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.flash { background: var(--flash); border-color: var(--flash); color: var(--flash-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.spacer { flex: 1 1 auto; }
.keys { font-size: 13px; color: var(--muted); }
kbd { font-family: var(--font-code); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; border-top: 6px solid var(--tc); padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; }
.team.lead { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 45%, transparent); }
.team-name { font-weight: 800; font-size: clamp(14px, 1.2vw, 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-score { grid-row: span 2; font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3vw, 54px); color: var(--tc); font-variant-numeric: tabular-nums; min-width: 1.6ch; text-align: right; }
.team-btns { display: flex; gap: 6px; }
.pt { border: 1px solid var(--line); background: transparent; border-radius: 8px; min-width: 40px; min-height: 34px; font-weight: 800; }
.pt.plus { background: color-mix(in srgb, var(--tc) 16%, transparent); border-color: color-mix(in srgb, var(--tc) 50%, transparent); }

.intro > div:first-child { display: flex; flex-direction: column; gap: 4px; align-self: stretch; }
.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(20px, 3vw, 56px); align-items: start; }
.hero-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 5vw, 92px); line-height: 1.02; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.hero-title span { color: var(--accent); }
.hero-sub { font-size: clamp(17px, 1.6vw, 28px); color: var(--muted); margin: 10px 0 0; max-width: 34ch; }
.rules { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: clamp(15px, 1.3vw, 23px); }
.rules li { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 12px; align-items: baseline; }
.rules b { font-family: var(--font-display); font-size: 0.85em; color: var(--accent); }
.setup { display: grid; gap: 10px; }
.setup h3 { margin: 0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.names label, .times label { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.names input, .times select { border: 1px solid var(--line); border-left: 6px solid var(--tc, var(--line)); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-weight: 700; min-width: 0; width: 100%; }
.times { display: flex; gap: 12px; flex-wrap: wrap; }

.section { margin: auto 0; display: grid; gap: 14px; max-width: 60ch; }
.section .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 80px); line-height: 1.05; margin: 0; text-wrap: balance; }
.section p { font-size: clamp(17px, 1.6vw, 28px); margin: 0; }
.section ol { margin: 0; padding-left: 1.4em; font-size: clamp(16px, 1.45vw, 26px); display: grid; gap: 6px; }

.podium { display: grid; gap: 10px; max-width: 760px; }
.podium .row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-left: 8px solid var(--tc); border-radius: 14px; padding: 10px 18px; font-size: clamp(18px, 1.8vw, 32px); font-weight: 800; }
.podium .row.win { background: color-mix(in srgb, var(--flash) 22%, var(--surface)); border-color: var(--flash); border-left-color: var(--tc); }
.podium .place { font-family: var(--font-display); color: var(--muted); }
.podium .sc { font-family: var(--font-display); color: var(--tc); font-variant-numeric: tabular-nums; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }

/* Пісочниця */
.sandbox[hidden] { display: none; }
.sandbox { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }
.sandbox-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sandbox-head h2 { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 2vw, 32px); }
.sandbox-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; min-height: 0; }
.sandbox textarea { width: 100%; height: 100%; min-height: 240px; resize: none; background: var(--code-bg); color: var(--code-ink); font-family: var(--font-code); font-size: clamp(15px, 1.4vw, 24px); line-height: 1.5; border: 0; border-radius: 14px; padding: 16px 20px; tab-size: 2; }
.sandbox .browser { display: flex; flex-direction: column; min-height: 240px; }
.sandbox .page { flex: 1 1 auto; overflow: auto; }

@media (max-width: 860px) {
  body { overflow-y: auto; height: auto; min-height: 100%; }
  .stage { overflow: visible; }
  .q-body, .q-body.split, .intro, .compare, .reveal, .rows, .sandbox-body { grid-template-columns: minmax(0, 1fr); }
  .timer { justify-self: start; }
  .ring { width: 110px; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .keys { display: none; }
  .sandbox { overflow: auto; }
}
</style>

<header class="bar">
  <div class="brand">HTML: <span>мозковий штурм</span></div>
  <nav class="track" id="track" aria-label="Етапи гри"></nav>
  <div class="tools">
    <button class="tool" id="sandbox-btn" type="button">Пісочниця</button>
    <button class="tool" id="sound-btn" type="button" aria-pressed="true">Звук</button>
    <button class="tool" id="theme-btn" type="button">Тема</button>
    <button class="tool" id="full-btn" type="button">Екран</button>
  </div>
</header>

<main class="stage" id="stage" aria-live="polite"></main>

<section class="board" id="board" aria-label="Табло команд"></section>

<div class="sandbox" id="sandbox" hidden role="dialog" aria-label="Пісочниця">
  <div class="sandbox-head">
    <h2>Пісочниця</h2>
    <span class="keys">Пишіть код ліворуч, браузер праворуч оновлюється сам. Файл cat.jpg тут «є».</span>
    <span class="spacer"></span>
    <button class="btn" type="button" id="sb-slide">Взяти код зі слайда</button>
    <button class="btn primary" type="button" id="sb-close">Закрити <kbd>Esc</kbd></button>
  </div>
  <div class="sandbox-body">
    <textarea id="sb-code" spellcheck="false" autocapitalize="off" aria-label="Код HTML"></textarea>
    <div class="browser"><div class="chrome"><i></i><i></i><i></i><span>index.html</span></div><div class="page" id="sb-page"></div></div>
  </div>
</div>

<script>
const DATA = {
  rounds: [
    { topic: "Заголовки", questions: [
      { code: `<h2>Розклад</h2>
<h1>Понеділок</h1>
<h4>Урок 1</h4>`,
        ask: "Який напис буде найбільшим?", answer: "«Понеділок»",
        explain: "Розмір залежить від тегу, а не від того, що вище в коді. h1 — найбільший, тому «Понеділок» більший за «Розклад» у h2." },
      { code: `<h1>Мій</h1>
<h1>сайт</h1>`,
        ask: "У скільки рядків буде текст на сторінці?", answer: "2",
        explain: "Кожен заголовок завжди починається з нового рядка. Щоб «Мій сайт» стояв в одному рядку, потрібен один h1." },
      { code: `<h1>Мій клас</h1>
<p>Нас 28 учнів.</p>
<h2>Наші свята</h2>
<h7>Новий рік</h7>`,
        ask: "Скільки заголовків побачить браузер?", answer: "2",
        explain: "Заголовки бувають тільки від h1 до h6. Тегу h7 не існує, тому «Новий рік» — звичайний текст." }
    ]},
    { topic: "Картинки img", questions: [
      { code: `<!-- cat.jpg лежить поруч з index.html -->
<img src="images/cat.jpg"
     alt="Рудий кіт">`, small: true,
        ask: "Що покаже браузер?", answer: "Текст «Рудий кіт» замість картинки",
        explain: "Браузер шукає файл у папці images, а він лежить поруч. Картинка не знайдеться — тоді видно alt." },
      { code: `<!-- cat.jpg має розмір 800 × 600 -->
<img src="cat.jpg" alt="Кіт"
     width="200">`, small: true,
        ask: "Якою буде висота картинки?", answer: "150 пікселів",
        explain: "Якщо задати лише width, браузер зберігає пропорції. 800 → 200 — це вчетверо менше, тож висота 600 : 4 = 150." },
      { code: `<!-- cat.jpg має розмір 800 × 600 -->
<img src="cat.jpg" alt="Кіт"

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function hlLine(line) {
  let s = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  s = s.replace(/&lt;!--[\s\S]*?--&gt;/g, m => "\u0001" + m + "\u0002");
  s = s.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)([^&]*?)(\/?&gt;)/g, (m, a, t, attrs, b) => {
    attrs = attrs.replace(/([a-zA-Z-]+)(=)("[^"]*")/g, '<span class="at">$1</span>$2<span class="vl">$3</span>')
                 .replace(/(\s)(reversed)(?=\s|$)/g, '$1<span class="at">$2</span>');
    return '<span class="tg">' + a + t + "</span>" + attrs + '<span class="tg">' + b + "</span>";
  });
  return s.replace(/\u0001/g, '<span class="cm">').replace(/\u0002/g, "</span>");
}
function codeHTML(code, marks, cls) {
  return `<pre class="code ${cls || ""}"><code>${code.split("\n").map((l, i) =>
    `<span class="ln ${marks && marks[i] ? marks[i] : ""}">${hlLine(l) || " "}</span>`).join("")}</code></pre>`;
}
function badLines(s) { const f = new Set(s.fixed.split("\n")); return s.code.split("\n").filter(l => !f.has(l)).map(l => l.trim()).join("\n"); }
function diffMarks(a, b, mark) {
  const other = new Set(b.split("\n"));
  return a.split("\n").map(l => other.has(l) ? "" : mark);
}

    const cls = state.i >= c.first && state.i <= c.last ? "now" : state.i > c.last ? "done" : "";
    return `<button class="chip ${cls}" type="button" data-go="${c.first}">${esc(c.name)}</button>`;

}

  } else if (s.type === "out") {
    const label = s.super ? `Суперпитання · ${s.points} бали` : `Раунд ${s.round} · ${esc(s.topic)} · питання ${s.n} / ${s.of}`;
    h = `<div><div class="eyebrow">${label}</div><h2 class="q-title">Що покаже браузер?</h2></div>
      <div class="q-body ${revealed ? "split" : ""}">
        <div class="q-main">
          ${codeHTML(s.code, null, s.small ? "small" : "")}
          <div class="ask"><small>Питання</small>${esc(s.ask)}</div>
        </div>
        ${revealed ? `<div class="answer">
            <div class="out-label">Відповідь</div><p class="ans">${esc(s.answer)}</p>
            <div class="out-label">Так покаже браузер</div>${browserHTML(s.code, "small")}
            <p class="explain">${esc(s.explain)}</p>
          </div>` : timerHTML()}
      </div>${controlsHTML(s)}`;
  } else if (s.type === "bug") {
    h = `<div><div class="eyebrow">ШІ помилився · ${esc(s.topic)} · ${s.n} / ${s.of} · 2 бали</div>
        ${revealed ? "" : `<h2 class="q-title">Знайдіть помилку</h2>`}</div>
      <div class="q-body ${revealed ? "wide" : ""}">
        <div class="q-main">
          <div class="ask ${revealed ? "compact" : ""}"><small>Учень попросив ШІ</small>«${esc(s.task)}»</div>
          ${revealed ? "" : codeHTML(s.code)}
          <div class="answer" ${revealed ? "" : "hidden"}>
            <div class="rows">
              <div class="col">
                <div class="out-label bad">Помилка</div>
                ${badLines(s) ? codeHTML(badLines(s), badLines(s).split("\n").map(() => "bad"), "small") : `<p class="miss">Рядка бракує взагалі — він підсвічений зеленим нижче.</p>`}
                <div class="out-label good">Виправлено</div>
                ${codeHTML(s.fixed, diffMarks(s.fixed, s.code, "good"), "small")}
              </div>
              <div class="col">
                <div class="out-label bad">Було в браузері</div>${revealed ? browserHTML(s.code, "small") : ""}
                <div class="out-label good">Стало</div>${revealed ? browserHTML(s.fixed, "small") : ""}
              </div>
            </div>
            <p class="explain">${esc(s.explain)}</p>
          </div>
        </div>
        ${revealed ? "" : timerHTML()}
      </div>${controlsHTML(s)}`;
  } else if (s.type === "end") {
    const order = state.teams.map((t, i) => ({ t, i, sc: state.scores[i] })).sort((a, b) => b.sc - a.sc);
    const top = order[0].sc;
    h = `<div class="section" style="max-width:none"><div class="eyebrow">Фінал</div><h2 class="big">Результати</h2>
      <div class="podium">${order.map(o => `<div class="row ${o.sc === top && top > 0 ? "win" : ""}" style="--tc: var(--t${o.i + 1})">
        <span class="place">${order.findIndex(x => x.sc === o.sc) + 1}</span><span>${esc(o.t)}</span><span class="sc">${o.sc}</span></div>`).join("")}</div>
      <p>Далі — вихідний квиток: самостійно, без команди.</p></div>${controlsHTML(s)}`;
  }
  stage.innerHTML = h;
  if (s.timeKey) drawTimer();
}

/* ---------- Таймер ---------- */
function resetTimer() {
  clearInterval(timer.id);
  const s = SLIDES[state.i];
  const t = s.timeKey ? state.times[s.timeKey] : 0;
  timer = { total: t, left: t, running: false, id: null, done: false };
}
function drawTimer() {
  const ring = $("ring"), fill = $("ring-fill"), num = $("ring-num");
  const b = $("timer-btn");
  if (b) b.textContent = timer.running ? "Пауза" : timer.done ? "Ще раз" : timer.left < timer.total ? "Продовжити" : "Старт таймера";
  if (!ring) return;
  const C = 2 * Math.PI * 52;
  fill.style.strokeDasharray = C;
  fill.style.strokeDashoffset = C * (1 - timer.left / timer.total);
  num.textContent = timer.done ? "Час!" : Math.ceil(timer.left);
  ring.classList.toggle("low", timer.left <= 5);
  ring.classList.toggle("over", timer.done);
  ring.classList.toggle("paused", !timer.running);
}
function toggleTimer() {
  if (!SLIDES[state.i].timeKey) return;
  if (timer.done) resetTimer();
  if (timer.running) { clearInterval(timer.id); timer.running = false; drawTimer(); return; }
  unlockAudio();
  timer.running = true;
  let lastBeep = Math.ceil(timer.left);
  const started = performance.now(), from = timer.left;
  timer.id = setInterval(() => {
    timer.left = Math.max(0, from - (performance.now() - started) / 1000);
    const sec = Math.ceil(timer.left);
    if (sec !== lastBeep && sec <= 3 && sec > 0) beep(660, 0.08);
    lastBeep = sec;
    if (timer.left <= 0) { clearInterval(timer.id); timer.running = false; timer.done = true; beep(440, 0.6); }
    drawTimer();
  }, 100);
  drawTimer();
}

/* ---------- Звук ---------- */
let audio = null;
function unlockAudio() { if (!state.sound) return; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) { audio = null; } }
function beep(freq, dur) {
  if (!state.sound || !audio) return;
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur + 0.05);
  } catch (e) {}
}

/* ---------- Пісочниця ---------- */
const sb = $("sandbox"), sbCode = $("sb-code"), sbPage = $("sb-page");
const drawSandbox = () => { sbPage.innerHTML = toPage(sbCode.value); };
function slideCode() { const s = SLIDES[state.i]; return s.code || "<h1>Привіт!</h1>\n<p>Пишіть код тут.</p>"; }
function openSandbox() { if (!sbCode.value) sbCode.value = slideCode(); drawSandbox(); sb.hidden = false; sbCode.focus(); }
function closeSandbox() { sb.hidden = true; }
sbCode.addEventListener("input", drawSandbox);
sbCode.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); sbCode.setRangeText("  ", sbCode.selectionStart, sbCode.selectionEnd, "end"); drawSandbox(); }
});
$("sandbox-btn").addEventListener("click", openSandbox);
$("sb-close").addEventListener("click", closeSandbox);
$("sb-slide").addEventListener("click", () => { sbCode.value = slideCode(); drawSandbox(); sbCode.focus(); });

/* ---------- Дії ---------- */
function go(i) {
  state.i = Math.max(0, Math.min(SLIDES.length - 1, i));
  revealed = false; resetTimer(); save(); render();
  stage.scrollTop = 0;
}
function reveal() {
  const s = SLIDES[state.i];
  if (!["out", "bug", "warm"].includes(s.type)) return;
  revealed = !revealed;
  if (revealed && timer.running) { clearInterval(timer.id); timer.running = false; }
  render();
}
function addPoint(t, d) { state.scores[t] = Math.max(0, state.scores[t] + d); save(); renderBoard(); if (SLIDES[state.i].type === "end") render(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) return go(+b.dataset.go);
  if (b.dataset.pt) return addPoint(+b.dataset.pt, +b.dataset.d);
  const a = b.dataset.act;
  if (a === "next") go(state.i + 1);
  else if (a === "prev") go(state.i - 1);
  else if (a === "timer") toggleTimer();
  else if (a === "reveal") reveal();
  else if (a === "reset-ask") {
    $("reset-zone").innerHTML = `<span class="confirm">Обнулити всі бали? <button class="btn" type="button" data-act="reset-yes">Так</button><button class="btn" type="button" data-act="reset-no">Ні</button></span>`;
  } else if (a === "reset-yes") { state.scores = [0, 0, 0, 0]; save(); render(); }
  else if (a === "reset-no") render();
});
document.addEventListener("input", e => {
  if (e.target.dataset.team != null) { state.teams[+e.target.dataset.team] = e.target.value.trim() || TEAM_DEFAULT[+e.target.dataset.team]; save(); renderBoard(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.time) { state.times[e.target.dataset.time] = +e.target.value; save(); render(); }
});
document.addEventListener("keydown", e => {
  if (!sb.hidden) { if (e.key === "Escape") { e.preventDefault(); closeSandbox(); } return; }
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(state.i + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(state.i - 1); }
  else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
  else if (e.key === "Enter") { e.preventDefault(); reveal(); }
  else if (/^Digit[1-4]$/.test(e.code)) { e.preventDefault(); addPoint(+e.code.slice(5) - 1, e.shiftKey ? -1 : 1); }
});

$("sound-btn").addEventListener("click", () => { state.sound = !state.sound; save(); syncTools(); if (state.sound) { unlockAudio(); beep(660, 0.08); } });
$("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
$("full-btn").addEventListener("click", () => {
  try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
});
function syncTools() { $("sound-btn").setAttribute("aria-pressed", String(state.sound)); $("sound-btn").textContent = state.sound ? "Звук увімк." : "Звук вимк."; }

function start(snap) {
  load();
  if (snap && snap.state) state = snap.state;
  fixIndex();
  syncTools(); resetTimer(); render();
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
